version: '3.8'

services:
  # Aplicacao Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tibia-party-finder
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/tibia_party_finder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - SPRING_DATASOURCE_USERNAME=tibia_user
      - SPRING_DATASOURCE_PASSWORD=tibia_password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_THYMELEAF_CACHE=true
      - TZ=America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tibia-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: tibia-mysql
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=tibia_party_finder
      - MYSQL_USER=tibia_user
      - MYSQL_PASSWORD=tibia_password
      - TZ=America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - tibia-network

volumes:
  mysql_data:
    driver: local

networks:
  tibia-network:
    driver: bridge
