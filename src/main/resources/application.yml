server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: tibia-party-finder

  # Database - MySQL local
  datasource:
    url: jdbc:mysql://localhost:3306/tibia_party_finder?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Thymeleaf
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8

  # Security - Desabilita autenticacao padrao
  security:
    user:
      name: admin
      password: admin

# Logging
logging:
  level:
    root: INFO
    com.tibia.app: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.web: DEBUG

# Configuracoes customizadas
app:
  verification:
    token-expiration-minutes: 15
    max-attempts: 5
    min-level: 50
    min-account-age-days: 30
    reverification-days: 30

  rate-limit:
    max-tokens-per-hour: 5
    max-requests-per-ip: 10
