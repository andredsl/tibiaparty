<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tibia Party Finder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="auth-icon">&#9876;</span>
                <h1>Tibia Party Finder</h1>
                <p class="auth-subtitle">Encontre sua PT em segundos</p>
            </div>

            <!-- Flash Messages -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

            <form th:action="@{/auth/login}" method="post" class="auth-form">
                <input type="hidden" th:if="${redirect}" name="redirect" th:value="${redirect}">

                <div class="form-group">
                    <label for="characterName">Nome do Personagem</label>
                    <input type="text"
                           id="characterName"
                           name="characterName"
                           th:value="${passwordLoginRequest?.characterName}"
                           placeholder="Ex: Knight Eternal"
                           required
                           autofocus
                           autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Sua senha"
                           required
                           autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Entrar
                </button>
            </form>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <div class="auth-register">
                <p>Ainda nao tem conta?</p>
                <a th:href="@{/auth/register}" class="btn btn-secondary btn-block">
                    Criar Conta
                </a>
            </div>
        </div>

        <footer class="auth-footer">
            <p>Tibia Party Finder - Nao afiliado a CipSoft</p>
        </footer>
    </div>
</body>
</html>
