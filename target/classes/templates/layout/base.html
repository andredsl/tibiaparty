<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ? ${pageTitle} + ' - Tibia Party Finder' : 'Tibia Party Finder'">Tibia Party Finder</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <th:block th:replace="${extraHead}"></th:block>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header" th:fragment="header">
            <div class="header-content">
                <a th:href="@{/}" class="logo">
                    <span class="logo-icon">&#9876;</span>
                    <span class="logo-text">Tibia PT Finder</span>
                </a>

                <nav class="nav" th:if="${session.TIBIA_PF_USER_ID != null}">
                    <a th:href="@{/parties}" class="nav-link">PTs</a>
                    <a th:href="@{/parties/create}" class="nav-link">Criar PT</a>
                    <a th:href="@{/profile}" class="nav-link">Perfil</a>
                    <a th:href="@{/auth/logout}" class="nav-link nav-logout">Sair</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Flash Messages -->
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>
            <div th:if="${warning}" class="alert alert-warning" th:text="${warning}"></div>

            <th:block th:replace="${content}"></th:block>
        </main>

        <!-- Footer -->
        <footer class="footer" th:fragment="footer">
            <p>Tibia Party Finder &copy; 2024 - Não afiliado à CipSoft</p>
        </footer>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <th:block th:replace="${extraScripts}"></th:block>
</body>
</html>
